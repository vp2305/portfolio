    <!-- Pre-React loading screen — pure HTML/CSS, zero JS -->
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0f1e;
        transition:
          opacity 0.6s ease,
          visibility 0.6s ease;
      }
      #preloader.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .pl-ring {
        position: relative;
        width: 90px;
        height: 90px;
      }
      .pl-ring svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        animation: pl-spin 1.6s cubic-bezier(0.6, 0.15, 0.35, 0.85) infinite;
      }
      .pl-ring svg circle {
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 120 200;
        stroke-dashoffset: 0;
        animation: pl-dash 1.6s ease-in-out infinite;
      }
      .pl-ring svg:nth-child(1) circle {
        stroke: #f59e0b;
      }
      .pl-ring svg:nth-child(2) {
        animation-delay: -0.4s;
        animation-direction: reverse;
      }
      .pl-ring svg:nth-child(2) circle {
        stroke: rgba(245, 158, 11, 0.25);
        animation-delay: -0.4s;
      }
      .pl-initials {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 1.25rem;
        letter-spacing: 0.08em;
        color: #f59e0b;
        opacity: 0.9;
        user-select: none;
      }
      @keyframes pl-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pl-dash {
        0% {
          stroke-dasharray: 1 200;
          stroke-dashoffset: 0;
        }
        50% {
          stroke-dasharray: 100 200;
          stroke-dashoffset: -35;
        }
        100% {
          stroke-dasharray: 100 200;
          stroke-dashoffset: -124;
        }
      }
    </style>
