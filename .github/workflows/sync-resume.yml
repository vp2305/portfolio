name: Sync Resume PDF

on:
  repository_dispatch:
    types: [resume-updated]

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download PDF from Resume repo
        env:
          GH_TOKEN: ${{ secrets.RESUME_SYNC_TOKEN }}
        run: |
          gh api /repos/vp2305/Resume/contents/MyResume.pdf \
            | python3 -c "
          import json,sys,base64
          d=json.load(sys.stdin)
          open('public/VaibhavPatel-Resume.pdf','wb').write(base64.b64decode(d['content']))
          "

      - name: Commit to dev if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/VaibhavPatel-Resume.pdf
          git diff --staged --quiet || git commit -m "chore: sync resume PDF [skip ci]"
          git push

      - name: Copy resume to main and push
        run: |
          git fetch origin main
          git checkout main
          git checkout dev -- public/VaibhavPatel-Resume.pdf
          git diff --staged --quiet || git commit -m "chore: sync resume PDF from dev [skip ci]"
          git push origin main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
